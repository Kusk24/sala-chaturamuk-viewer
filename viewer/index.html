<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala Chaturamuk Phaichit — Image-Based Rendering Viewer</title>
<style>
  /* No build step, no framework, no external assets: this file must open
     straight from file:// on a lab machine. */
  :root {
    --bg: #14110f;
    --panel: #1e1a17;
    --line: #332c26;
    --text: #ece6df;
    --muted: #9a8f84;
    --accent: #c9a227;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    padding: 18px 24px 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  #stage {
    position: relative;
    width: 100%;
    max-width: 1000px;
    aspect-ratio: 3 / 2;
    background: #0c0a09;
    border: 1px solid var(--line);
    border-radius: 6px;
    overflow: hidden;
    cursor: grab;
    user-select: none;
    touch-action: pan-y;
  }
  #stage.dragging { cursor: grabbing; }
  #frame {
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  #status {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 8px 12px;
    background: linear-gradient(transparent, rgba(0,0,0,.75));
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
  #status.error { color: #e0a3a3; background: rgba(60,20,20,.9); text-align: left; }
  #progress {
    position: absolute; left: 12px; right: 12px; top: 12px;
    height: 3px; background: rgba(255,255,255,.12); border-radius: 2px; overflow: hidden;
  }
  #bar { height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }
  .controls {
    width: 100%; max-width: 1000px;
    margin-top: 14px;
    display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center;
    padding: 12px 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    font-size: 13px;
  }
  .readout { color: var(--muted); }
  .readout b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  label.switch { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-left: auto; }
  footer { padding: 14px 24px 22px; color: var(--muted); font-size: 12px; max-width: 1000px; }
  #versions {
    width: 100%; max-width: 1000px;
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-bottom: 10px;
  }
  .version-btn {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 14px;
  }
  .version-btn:hover { color: var(--text); border-color: var(--accent); }
  .version-btn.active { background: var(--accent); color: #14110f; border-color: var(--accent); font-weight: 600; }
  .step-btn {
    font: inherit; font-size: 13px; cursor: pointer;
    background: var(--bg); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 4px 14px;
    user-select: none; -webkit-user-select: none;
    touch-action: none;
  }
  .step-btn:hover { border-color: var(--accent); color: var(--accent); }
  .step-btn:active { background: var(--accent); color: #14110f; }
  kbd {
    background: var(--panel); border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: 3px; padding: 1px 5px; font-size: 11px; font-family: inherit;
  }
</style>
</head>
<body>

<header>
  <h1>Sala Chaturamuk Phaichit — Image-Based Rendering Viewer</h1>
  <p>Novel viewpoints synthesized from photographs by optical-flow view interpolation. No 3D model.
     <span id="summary"></span></p>
</header>

<main>
  <div id="versions" hidden></div>
  <div id="stage">
    <img id="frame" alt="Sala Chaturamuk Phaichit">
    <div id="progress" hidden><div id="bar"></div></div>
    <div id="status">Loading…</div>
  </div>

  <div class="controls">
    <button class="step-btn" id="step-back" aria-label="rotate left">&#9664;</button>
    <button class="step-btn" id="step-fwd" aria-label="rotate right">&#9654;</button>
    <span class="readout">Angle <b id="angle">—</b></span>
    <span class="readout">Frame <b id="counter">—</b></span>
    <span class="readout" id="mode"></span>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      Interpolated frames
    </label>
  </div>
</main>

<footer>
  Drag to rotate · hold <kbd>◀</kbd> <kbd>▶</kbd> to auto-rotate · <kbd>←</kbd> <kbd>→</kbd>
  step one frame · <kbd>B</kbd> toggles the captured-only baseline. <span id="arc-note"></span>
</footer>

<!-- manifest.js / versions.js are generated by build_sequence.py / run_pipeline.py.
     app.js loads them itself (as scripts, not fetch) so this page works over
     file:// too, and so it can swap in a different version's manifest without
     a page reload -- see loadManifest()/loadVersionsList() in app.js. -->
<script src="app.js"></script>
</body>
</html>
